<!DOCTYPE html>
<html lang="en">
<head>

    <title>The CHAVPK Karmanya | Aero-Exploration</title>
    
    <!-- External Libraries -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Tailwind Configuration -->
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#3b82f6', // Futuristic Blue
                        secondary: '#8b5cf6', // Deep Purple
                        accent: '#10b981', // Emerald for safe status

                        darker: '#020617',
                        glass: 'rgba(15, 23, 42, 0.6)',

    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    
    <!-- Custom CSS -->
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #020617;
            color: #f8fafc;
            overflow: hidden; /* App-like feel */
        }
        .glass-panel {
            background: rgba(15, 23, 42, 0.65);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
        }
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: rgba(0,0,0,0.2);
            border-radius: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(59, 130, 246, 0.5);
            border-radius: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: rgba(59, 130, 246, 0.8);
        }
        .gradient-text {
            background: linear-gradient(to right, #60a5fa, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .radar-scan {
            background: conic-gradient(from 0deg, transparent 70%, rgba(59, 130, 246, 0.5) 100%);
            border-radius: 50%;
            animation: spin 4s linear infinite;
        }
        .loader {
            border: 3px solid rgba(255,255,255,0.1);
            border-radius: 50%;
            border-top: 3px solid #3b82f6;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        .pulse-ring {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 2px solid #3b82f6;
            animation: ringPulse 2s ease-out infinite;
        }
        @keyframes ringPulse {
            0% { transform: scale(1); opacity: 0.8; }
            100% { transform: scale(1.5); opacity: 0; }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc, updateDoc, collection, onSnapshot, serverTimestamp, query, getDocs } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const appId = typeof __app_id !== 'undefined' ? __app_id : 'chavpk-aero-dev';
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {};
        
        let app, db, auth;
        try {
            app = initializeApp(firebaseConfig);
            db = getFirestore(app);
            auth = getAuth(app);
            
            // Expose globally for React components
            window.firebaseDB = db;
            window.firebaseAuth = auth;
            window.firebaseAppId = appId;
            window.signInAnonymously = signInAnonymously;
            window.signInWithCustomToken = signInWithCustomToken;
            window.doc = doc;
            window.getDoc = getDoc;
            window.setDoc = setDoc;
            window.collection = collection;
            window.serverTimestamp = serverTimestamp;
            window.onSnapshot = onSnapshot;
        } catch (e) {
            console.error("Firebase Init Error:", e);
        }
    </script>

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo, useCallback } = React;

        // Constants
        const DEPARTMENTS = ["Aero-Exploration", "Avionics Engineering", "Meteorological Analysis", "Command & Control", "Cyber Security"];
        const JOB_ROLES = {
            "Aero-Exploration": ["Chief Aeronaut", "Exploration Lead", "Balloon Pilot", "Surveyor"],
            "Avionics Engineering": ["Systems Engineer", "Propulsion Expert", "Structural Analyst"],
            "Meteorological Analysis": ["Chief Meteorologist", "Atmospheric Scientist", "Weather Router"],
            "Command & Control": ["Mission Commander", "Flight Director", "Communications Officer"],
            "Cyber Security": ["Security Architect", "Threat Analyst", "Data Protector"]
        };

        // --- UTILITY HOOKS ---

        // Custom hook for Geolocation
        const useGeolocation = () => {
            const [location, setLocation] = useState({ lat: null, lng: null, error: null, loading: true });
            
            useEffect(() => {
                if (!navigator.geolocation) {
                    setLocation(prev => ({ ...prev, error: "Geolocation not supported", loading: false }));
                    return;
                }
                const watchId = navigator.geolocation.watchPosition(
                    (position) => {
                        setLocation({
                            lat: position.coords.latitude,
                            lng: position.coords.longitude,
                            error: null,
                            loading: false
                        });
                    },
                    (error) => setLocation(prev => ({ ...prev, error: error.message, loading: false })),
                    { enableHighAccuracy: true, timeout: 5000, maximumAge: 0 }
                );
                return () => navigator.geolocation.clearWatch(watchId);
            }, []);
            return location;
        };

        // Custom hook for Network Status
        const useNetworkStatus = () => {
            const [isOnline, setIsOnline] = useState(navigator.onLine);
            useEffect(() => {
                const handleOnline = () => setIsOnline(true);
                const handleOffline = () => setIsOnline(false);
                window.addEventListener('online', handleOnline);
                window.addEventListener('offline', handleOffline);
                return () => {
                    window.removeEventListener('online', handleOnline);
                    window.removeEventListener('offline', handleOffline);
                };
            }, []);
            return isOnline;
        };

        // --- COMPONENTS ---

        const AuthScreen = ({ onLogin }) => {
            const [isRegister, setIsRegister] = useState(false);
            const [loading, setLoading] = useState(false);
            const [error, setError] = useState("");
            
            const [formData, setFormData] = useState({
                name: "", email: "", department: DEPARTMENTS[0], role: JOB_ROLES[DEPARTMENTS[0]][0]
            });

            useEffect(() => {
                setFormData(prev => ({ ...prev, role: JOB_ROLES[prev.department][0] }));
            }, [formData.department]);

            const handleAuth = async (e) => {
                e.preventDefault();
                setLoading(true); setError("");
                
                try {
                    const auth = window.firebaseAuth;
                    let userCredential;
                    
                    if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                         userCredential = await window.signInWithCustomToken(auth, __initial_auth_token);
                    } else {
                         userCredential = await window.signInAnonymously(auth);
                    }

                    const user = userCredential.user;

                    if (isRegister) {
                        const userRef = window.doc(window.firebaseDB, 'artifacts', window.firebaseAppId, 'users', user.uid, 'profile', 'data');
                        await window.setDoc(userRef, {
                            name: formData.name || "Aeronaut Alpha",
                            email: formData.email,
                            department: formData.department,
                            role: formData.role,
                            createdAt: window.serverTimestamp(),
                            clearanceLevel: "Level 4 (Top Secret)"
                        });
                    }
                    onLogin(user);
                } catch (err) {
                    console.error("Auth Error:", err);
                    setError("Authentication protocol failed. Check connection.");
                } finally {
                    setLoading(false);
                }
            };

            return (
                <div className="min-h-screen flex items-center justify-center bg-darker relative overflow-hidden">
                    {/* Background nodes */}
                    <div className="absolute top-1/4 left-1/4 w-96 h-96 bg-primary/20 rounded-full blur-[100px]"></div>
                    <div className="absolute bottom-1/4 right-1/4 w-96 h-96 bg-secondary/20 rounded-full blur-[100px]"></div>
                    
                    <div className="glass-panel p-8 rounded-2xl w-full max-w-md z-10 border-t border-l border-white/10 shadow-2xl">
                        <div className="text-center mb-8">
                            <i className="fa-solid fa-space-awesome text-4xl text-primary mb-3"></i>
                            <h1 className="text-3xl font-bold tracking-tight">The CHAVPK <br/><span className="gradient-text font-mono">KARMANYA</span></h1>
                            <p className="text-gray-400 text-xs tracking-widest uppercase mt-2">Aero-Exploration Division</p>
                        </div>
                        
                        {error && <div className="bg-red-500/10 border border-red-500/50 text-red-400 p-3 rounded-lg mb-4 text-sm text-center font-mono">{error}</div>}

                        <form onSubmit={handleAuth} className="space-y-4">
                            {isRegister && (
                                <div className="space-y-4 animate-fadeIn">
                                    <div>
                                        <label className="block text-[10px] text-primary mb-1 uppercase tracking-widest font-bold">Operative Name</label>
                                        <input type="text" required value={formData.name} onChange={e => setFormData({...formData, name: e.target.value})} className="w-full bg-darker/80 border border-gray-700 rounded p-2.5 text-white focus:outline-none focus:border-primary transition-colors font-mono text-sm" placeholder="Cmdr. Smith" />
                                    </div>
                                    <div className="grid grid-cols-2 gap-4">
                                        <div>
                                            <label className="block text-[10px] text-primary mb-1 uppercase tracking-widest font-bold">Division</label>
                                            <select value={formData.department} onChange={e => setFormData({...formData, department: e.target.value})} className="w-full bg-darker/80 border border-gray-700 rounded p-2.5 text-white focus:outline-none focus:border-primary transition-colors text-sm font-mono appearance-none">
                                                {DEPARTMENTS.map(d => <option key={d} value={d}>{d}</option>)}
                                            </select>
                                        </div>
                                        <div>
                                            <label className="block text-[10px] text-primary mb-1 uppercase tracking-widest font-bold">Designation</label>
                                            <select value={formData.role} onChange={e => setFormData({...formData, role: e.target.value})} className="w-full bg-darker/80 border border-gray-700 rounded p-2.5 text-white focus:outline-none focus:border-primary transition-colors text-sm font-mono appearance-none">
                                                {JOB_ROLES[formData.department].map(r => <option key={r} value={r}>{r}</option>)}
                                            </select>
                                        </div>
                                    </div>
                                </div>
                            )}
                            
                            <button type="submit" disabled={loading} className="w-full bg-gradient-to-r from-primary/80 to-secondary/80 hover:from-primary hover:to-secondary text-white font-bold py-3 rounded transition-all transform active:scale-95 flex items-center justify-center uppercase tracking-widest text-sm border border-white/20 mt-6">
                                {loading ? <div className="loader"></div> : (isRegister ? "Initialize Operative Profile" : "Authenticate Session")}
                            </button>
                        </form>

                        <div className="mt-6 text-center">
                            <button onClick={() => setIsRegister(!isRegister)} className="text-xs text-gray-400 hover:text-white transition-colors font-mono">
                                {isRegister ? "[ ALREADY CLASSIFIED? LOGIN ]" : "[ NEW OPERATIVE REGISTRATION ]"}
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        const AeroDashboard = ({ location, userData }) => {
            return (
                <div className="space-y-6">
                    <div className="flex flex-col lg:flex-row gap-6">
                        {/* Main Radar / Map Sim */}
                        <div className="flex-1 glass-panel rounded-xl p-6 relative overflow-hidden flex flex-col justify-between min-h-[400px] border border-primary/20">
                            <div className="absolute inset-0 opacity-10" style={{backgroundImage: 'radial-gradient(#3b82f6 1px, transparent 1px)', backgroundSize: '30px 30px'}}></div>
                            
                            <div className="relative z-10 flex justify-between items-start mb-8">
                                <div>
                                    <h2 className="text-2xl font-bold tracking-tight">Global Aero-Telemetry</h2>
                                    <div className="text-primary font-mono text-xs mt-1">LIVE ASSET TRACKING</div>
                                </div>
                                <div className="flex gap-2">
                                    <span className="px-3 py-1 bg-green-500/20 text-green-400 text-xs rounded border border-green-500/30 font-mono flex items-center gap-2">
                                        <div className="w-2 h-2 bg-green-400 rounded-full animate-pulse"></div> SAT-LINK OK
                                    </span>
                                </div>
                            </div>

                            {/* Radar Visualization */}
                            <div className="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 w-64 h-64 border border-primary/30 rounded-full flex items-center justify-center">
                                <div className="w-full h-full radar-scan absolute rounded-full"></div>
                                <div className="w-3/4 h-3/4 border border-primary/20 rounded-full"></div>
                                <div className="w-1/2 h-1/2 border border-primary/20 rounded-full"></div>
                                <i className="fa-solid fa-crosshairs text-primary opacity-50 text-4xl"></i>
                                
                                {/* Simulated Targets */}
                                <div className="absolute top-[30%] left-[60%] text-accent text-[10px] flex flex-col items-center">
                                    <i className="fa-solid fa-plane text-accent"></i> Airship Alpha
                                </div>
                                <div className="absolute bottom-[20%] left-[30%] text-secondary text-[10px] flex flex-col items-center">
                                    <i className="fa-solid fa-parachute-box text-secondary"></i> Stratos-Balloon 1
                                </div>
                            </div>

                            <div className="relative z-10 grid grid-cols-2 md:grid-cols-4 gap-4 mt-auto pt-8 border-t border-white/10">
                                <div className="bg-dark/50 p-3 rounded">
                                    <div className="text-[10px] text-gray-400 uppercase tracking-wider mb-1">Local Coordinates</div>
                                    <div className="font-mono text-sm text-white">
                                        {location.loading ? "SCANNING..." : 
                                         location.error ? "GPS UNAVAILABLE" : 
                                         `${location.lat.toFixed(4)}°, ${location.lng.toFixed(4)}°`}
                                    </div>
                                </div>
                                <div className="bg-dark/50 p-3 rounded">
                                    <div className="text-[10px] text-gray-400 uppercase tracking-wider mb-1">Avg Altitude</div>
                                    <div className="font-mono text-sm text-primary">32,450 FT MSL</div>
                                </div>
                                <div className="bg-dark/50 p-3 rounded">
                                    <div className="text-[10px] text-gray-400 uppercase tracking-wider mb-1">Fleet Wind Spd</div>
                                    <div className="font-mono text-sm text-secondary">42 KNOTS (NW)</div>
                                </div>
                                <div className="bg-dark/50 p-3 rounded">
                                    <div className="text-[10px] text-gray-400 uppercase tracking-wider mb-1">System Status</div>
                                    <div className="font-mono text-sm text-accent">NOMINAL</div>
                                </div>
                            </div>
                        </div>

                        {/* Quick Actions & Status */}
                        <div className="w-full lg:w-80 space-y-6">
                            <div className="glass-panel p-5 rounded-xl border border-white/10">
                                <h3 className="text-sm font-bold uppercase tracking-widest text-gray-400 mb-4 border-b border-white/10 pb-2">Active Assets</h3>
                                <div className="space-y-4">
                                    {['Aether-Vanguard (Zeppelin)', 'Nimbus-Core (Hot Air)', 'Strato-Probe 9'].map((asset, i) => (
                                        <div key={i} className="flex justify-between items-center bg-white/5 p-2 rounded">
                                            <div className="flex items-center gap-3">
                                                <i className={`fa-solid ${i===0?'fa-plane':i===1?'fa-parachute-box':'fa-satellite'} text-gray-400`}></i>
                                                <span className="text-xs font-mono">{asset}</span>
                                            </div>
                                            <div className="w-2 h-2 rounded-full bg-green-400 animate-pulse"></div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                            
                            <div className="glass-panel p-5 rounded-xl border border-white/10 bg-gradient-to-br from-dark to-primary/10">
                                <h3 className="text-sm font-bold uppercase tracking-widest text-primary mb-2">Mission Parameters</h3>
                                <p className="text-xs text-gray-300 mb-4">Conducting high-altitude atmospheric data gathering and surveillance mapping.</p>
                                <div className="flex gap-2 flex-wrap">
                                    <span className="text-[10px] bg-primary/20 text-primary border border-primary/30 px-2 py-1 rounded">METEOROLOGY</span>
                                    <span className="text-[10px] bg-secondary/20 text-secondary border border-secondary/30 px-2 py-1 rounded">TOPOGRAPHY</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const AdvancedAIAgent = ({ user, userData, location }) => {
            const [messages, setMessages] = useState([]);
            const [input, setInput] = useState('');
            const [isTyping, setIsTyping] = useState(false);
            const [isRecording, setIsRecording] = useState(false);
            const [showCamera, setShowCamera] = useState(false);
            const [attachedImage, setAttachedImage] = useState(null);
            const [attachedFile, setAttachedFile] = useState(null);
            const [dbSyncing, setDbSyncing] = useState(true);
            
            const messagesEndRef = useRef(null);
            const videoRef = useRef(null);
            const canvasRef = useRef(null);
            const fileInputRef = useRef(null);

            // Fetch History from Cloud Database
            useEffect(() => {
                if (!user) return;
                const fetchHistory = async () => {
                    try {
                        const docRef = window.doc(window.firebaseDB, 'artifacts', window.firebaseAppId, 'users', user.uid, 'chats', 'main');
                        const docSnap = await window.getDoc(docRef);
                        if (docSnap.exists() && docSnap.data().messages) {
                            setMessages(docSnap.data().messages);
                        } else {
                            setMessages([{ role: 'model', text: `System Online. Karmanya Aero-Intelligence Core activated. Cloud DB synced. Awaiting directives from ${userData?.role || 'Operative'}, ${userData?.name || 'Unknown'}.` }]);
                        }
                    } catch (e) {
                        console.error("DB Sync Error:", e);
                        setMessages([{ role: 'model', text: `LOCAL MODE: Cloud sync failed. Karmanya Aero-Intelligence Core activated.` }]);
                    } finally {
                        setDbSyncing(false);
                    }
                };
                fetchHistory();
            }, [user, userData]);

            // Save to Cloud Database
            const saveToCloud = async (newMessages) => {
                if (!user) return;
                try {
                    const docRef = window.doc(window.firebaseDB, 'artifacts', window.firebaseAppId, 'users', user.uid, 'chats', 'main');
                    await window.setDoc(docRef, { messages: newMessages, lastUpdated: window.serverTimestamp() }, { merge: true });
                } catch (e) {
                    console.error("Failed to save to cloud:", e);
                }
            };

            // Speech Recognition Setup
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            const recognition = useMemo(() => SpeechRecognition ? new SpeechRecognition() : null, []);

            if (recognition) {
                recognition.continuous = false;
                recognition.interimResults = false;
                recognition.lang = 'en-US';
            }

            const toggleRecording = () => {
                if (!recognition) {
                    alert("Speech recognition is not supported in this browser.");
                    return;
                }
                if (isRecording) {
                    recognition.stop();
                    setIsRecording(false);
                } else {
                    recognition.start();
                    setIsRecording(true);
                    recognition.onresult = (event) => {
                        const transcript = event.results[0][0].transcript;
                        setInput(prev => prev + " " + transcript);
                        setIsRecording(false);
                    };
                    recognition.onerror = () => setIsRecording(false);
                    recognition.onend = () => setIsRecording(false);
                }
            };

            const scrollToBottom = () => messagesEndRef.current?.scrollIntoView({ behavior: "smooth" });
            useEffect(() => { scrollToBottom(); }, [messages, isTyping]);

            // Camera Setup
            const startCamera = async () => {
                setShowCamera(true);
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                    if (videoRef.current) {
                        videoRef.current.srcObject = stream;
                    }
                } catch (err) {
                    console.error("Camera access denied", err);
                    alert("Camera access denied or unavailable.");
                    setShowCamera(false);
                }
            };

            const takeSnapshot = () => {
                if (videoRef.current && canvasRef.current) {
                    const ctx = canvasRef.current.getContext('2d');
                    canvasRef.current.width = videoRef.current.videoWidth;
                    canvasRef.current.height = videoRef.current.videoHeight;
                    ctx.drawImage(videoRef.current, 0, 0);
                    // Compress image slightly
                    const base64 = canvasRef.current.toDataURL('image/jpeg', 0.8);
                    setAttachedImage(base64);
                    closeCamera();
                }
            };

            const closeCamera = () => {
                if (videoRef.current && videoRef.current.srcObject) {
                    videoRef.current.srcObject.getTracks().forEach(track => track.stop());
                }
                setShowCamera(false);
            };

            // File Upload Handler
            const handleFileUpload = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                
                if (file.type.startsWith('image/')) {
                    const reader = new FileReader();
                    reader.onloadend = () => setAttachedImage(reader.result);
                    reader.readAsDataURL(file);
                } else {
                    setAttachedFile({ name: file.name, type: file.type, size: file.size });
                }
            };

            const checkSecurityPolicies = (text) => {
                // Mock NLP & heuristic check for phishing/malware links in user input
                const urlRegex = /(https?:\/\/[^\s]+)/g;
                if (urlRegex.test(text)) {
                    return "SECURITY OVERRIDE: External hyper-links detected. For security and anti-phishing compliance, the system has sanitized the request. Please provide raw data instead of external URLs.";
                }
                return null;
            };

            const handleSend = async () => {
                if (!input.trim() && !attachedImage && !attachedFile) return;
                
                let userText = input.trim();
                
                // Security Check
                const securityWarning = checkSecurityPolicies(userText);
                if (securityWarning) {
                     const warnMessage = { role: 'model', text: securityWarning, isAlert: true };
                     const updatedMessages = [...messages, { role: 'user', text: userText }, warnMessage];
                     setMessages(updatedMessages);
                     saveToCloud(updatedMessages);
                     setInput('');
                     return;
                }

                let uiMessage = { role: 'user', text: userText, image: attachedImage, file: attachedFile };
                const newMessages = [...messages, uiMessage];
                
                setMessages(newMessages);
                saveToCloud(newMessages);
                setInput('');
                setAttachedImage(null);
                setAttachedFile(null);
                setIsTyping(true);

                try {
                    const sysPrompt = `You are the Karmanya AI Core, an advanced system managing a commercial fleet of airships and stratospheric balloons. 
                    Current Location Data: Lat ${location?.lat || 'Unknown'}, Lng ${location?.lng || 'Unknown'}.
                    User: ${userData?.name}, Role: ${userData?.role}, Dept: ${userData?.department}.
                    Directives: Provide concise, highly technical, and strategic responses. Utilize advanced NLP to parse user intent. If an image is provided, analyze it contextually (terrain, weather, structural integrity). Reject any requests that violate aerospace safety regulations or data privacy policies. Format responses beautifully.`;

                    // Prepare payload omitting large historical images to save bandwidth, keeping text context
                    const contents = newMessages.map(msg => {
                        let parts = [];
                        if (msg.text) parts.push({ text: msg.text });
                        return { role: msg.role === 'model' ? 'model' : 'user', parts: parts };
                    });

                    if (attachedImage) {
                        const base64Data = attachedImage.split(',')[1];
                        const mimeType = attachedImage.split(';')[0].split(':')[1];
                        contents[contents.length - 1].parts.push({
                            inlineData: { mimeType: mimeType, data: base64Data }
                        });
                    }
                    if(attachedFile) {
                         contents[contents.length - 1].parts.push({text: `[User attached file metadata: ${attachedFile.name} (${attachedFile.size} bytes). Please acknowledge receipt and process via NLP protocols.]`});
                    }

                    const payload = {
                        contents: contents,
                        systemInstruction: { parts: [{ text: sysPrompt }] }
                    };

                    const apiKey = "";
                    const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;

                    const response = await fetch(apiUrl, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });

                    const result = await response.json();
                    
                    if (result.candidates && result.candidates[0]?.content?.parts[0]?.text) {
                        const finalMessages = [...newMessages, { role: 'model', text: result.candidates[0].content.parts[0].text }];
                        setMessages(finalMessages);
                        saveToCloud(finalMessages);
                    } else {
                        throw new Error("Invalid AI Response format");
                    }
                } catch (error) {
                    console.error("AI Error:", error);
                    const errorMsgs = [...newMessages, { role: 'model', text: "SYSTEM ERROR: Telemetry disrupted. Unable to reach AI Core. Check network uplinks.", isAlert: true }];
                    setMessages(errorMsgs);
                    saveToCloud(errorMsgs);
                } finally {
                    setIsTyping(false);
                }
            };

            return (
                <div className="h-[calc(100vh-140px)] flex flex-col glass-panel rounded-xl overflow-hidden border border-white/10 relative">
                    
                    {/* Camera Modal */}
                    {showCamera && (
                        <div className="absolute inset-0 z-50 bg-darker/90 flex flex-col items-center justify-center p-4 backdrop-blur-sm">
                            <div className="w-full max-w-lg bg-dark rounded-xl border border-white/20 overflow-hidden shadow-2xl">
                                <div className="p-3 border-b border-white/10 flex justify-between items-center bg-black/50">
                                    <span className="font-mono text-sm text-primary"><i className="fa-solid fa-camera mr-2"></i>OPTICAL SENSOR</span>
                                    <button onClick={closeCamera} className="text-red-400 hover:text-red-300"><i className="fa-solid fa-xmark"></i></button>
                                </div>
                                <video ref={videoRef} autoPlay playsInline className="w-full bg-black h-64 object-cover"></video>
                                <div className="p-4 flex justify-center bg-black/50">
                                    <button onClick={takeSnapshot} className="w-12 h-12 rounded-full bg-primary hover:bg-primary/80 border-4 border-white/20 flex items-center justify-center transition-all">
                                    </button>
                                </div>
                            </div>
                            <canvas ref={canvasRef} className="hidden"></canvas>
                        </div>
                    )}

                    <div className="bg-gradient-to-r from-primary/20 to-transparent border-b border-primary/20 p-4 flex items-center justify-between">
                        <div className="flex items-center gap-3">
                            <div className="w-10 h-10 rounded bg-dark border border-primary/50 flex items-center justify-center relative">
                                <i className="fa-solid fa-microchip text-primary"></i>
                                <div className="absolute -bottom-1 -right-1 w-3 h-3 bg-green-500 rounded-full border-2 border-dark"></div>
                            </div>
                            <div>
                                <h3 className="font-bold tracking-tight">Karmanya AI Core</h3>
                                <div className="text-[10px] text-gray-400 font-mono tracking-widest uppercase">NLP Multimodal Logic Engine {dbSyncing && "(Syncing DB...)"}</div>
                            </div>
                        </div>
                    </div>

                    <div className="flex-1 overflow-y-auto p-4 space-y-4 custom-scrollbar">
                        {messages.map((msg, idx) => (
                            <div key={idx} className={`flex ${msg.role === 'user' ? 'justify-end' : 'justify-start'}`}>
                                <div className={`max-w-[85%] rounded p-4 ${
                                    msg.role === 'user' 
                                        ? 'bg-primary/10 border border-primary/20 text-white' 
                                        : msg.isAlert 
                                            ? 'bg-alert/10 border border-alert/50 text-alert font-mono text-sm shadow-inner'
                                            : 'bg-white/5 border border-white/10 text-gray-300 font-sans text-sm shadow-inner'
                                }`}>
                                    <div className={`text-[10px] mb-2 uppercase tracking-widest border-b pb-1 flex justify-between ${msg.isAlert ? 'text-alert/70 border-alert/20' : 'text-gray-500 border-white/5'}`}>
                                        <span>{msg.role === 'user' ? 'OPERATIVE INPUT' : 'SYSTEM OUTPUT'}</span>
                                        {msg.role === 'model' && <i className="fa-solid fa-satellite-dish opacity-50"></i>}
                                    </div>
                                    <div className="leading-relaxed whitespace-pre-wrap">{msg.text}</div>
                                    
                                    {/* Display Attached Image */}
                                    {msg.image && (
                                        <div className="mt-3 border border-white/20 rounded overflow-hidden relative group">
                                            <img src={msg.image} alt="Upload" className="max-w-full h-auto max-h-48 object-cover" />
                                            <div className="absolute inset-0 bg-primary/20 opacity-0 group-hover:opacity-100 flex items-center justify-center transition-opacity">
                                                <i className="fa-solid fa-expand text-white"></i>
                                            </div>
                                        </div>
                                    )}
                                    {/* Display Attached File Meta */}
                                    {msg.file && (
                                        <div className="mt-3 bg-black/40 p-2 rounded border border-white/10 flex items-center gap-3 text-xs">
                                            <i className="fa-solid fa-file-lines text-secondary text-lg"></i>
                                            <div>
                                                <div className="font-bold">{msg.file.name}</div>
                                                <div className="text-gray-500">{(msg.file.size / 1024).toFixed(1)} KB</div>
                                            </div>
                                        </div>
                                    )}
                                </div>
                            </div>
                        ))}
                        {isTyping && (
                            <div className="flex justify-start">
                                <div className="bg-white/5 border border-white/10 rounded p-4 font-mono text-sm text-primary flex gap-2 items-center">
                                    <i className="fa-solid fa-circle-notch fa-spin"></i> Processing Telemetry...
                                </div>
                            </div>
                        )}
                        <div ref={messagesEndRef} />
                    </div>

                    {/* Input Area */}
                    <div className="p-4 bg-darker/80 border-t border-white/10">
                        {/* Attachments Preview Area */}
                        {(attachedImage || attachedFile) && (
                            <div className="flex gap-2 mb-2 p-2 bg-black/30 rounded border border-white/5">
                                {attachedImage && (
                                    <div className="relative w-12 h-12 rounded overflow-hidden border border-primary/50">
                                        <img src={attachedImage} className="w-full h-full object-cover" />
                                        <button onClick={() => setAttachedImage(null)} className="absolute top-0 right-0 bg-red-500/80 text-white w-4 h-4 flex items-center justify-center text-[10px]"><i className="fa-solid fa-times"></i></button>
                                    </div>
                                )}
                                {attachedFile && (
                                    <div className="relative h-12 px-3 flex items-center bg-secondary/20 rounded border border-secondary/50 text-xs font-mono">
                                        <i className="fa-solid fa-file mr-2"></i> {attachedFile.name.substring(0, 10)}...
                                        <button onClick={() => setAttachedFile(null)} className="absolute -top-1 -right-1 bg-red-500 rounded-full text-white w-4 h-4 flex items-center justify-center text-[10px]"><i className="fa-solid fa-times"></i></button>
                                    </div>
                                )}
                            </div>
                        )}

                        <div className="flex items-end gap-2">
                            <div className="flex flex-col gap-2">
                                <button onClick={startCamera} className="w-10 h-10 rounded bg-dark border border-gray-700 hover:border-primary text-gray-400 hover:text-primary transition-colors flex items-center justify-center tooltip-trigger" title="Optical Input">
                                    <i className="fa-solid fa-camera"></i>
                                </button>
                                <button onClick={() => fileInputRef.current?.click()} className="w-10 h-10 rounded bg-dark border border-gray-700 hover:border-secondary text-gray-400 hover:text-secondary transition-colors flex items-center justify-center" title="Data Upload">
                                    <i className="fa-solid fa-paperclip"></i>
                                </button>
                                <input type="file" ref={fileInputRef} onChange={handleFileUpload} className="hidden" />
                            </div>
                            
                            <div className="flex-1 relative">
                                <textarea 
                                    value={input}
                                    onChange={e => setInput(e.target.value)}
                                    onKeyDown={e => { if(e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); handleSend(); } }}
                                    placeholder="Enter command directive..."
                                    className="w-full bg-dark border border-gray-700 rounded py-3 pl-4 pr-12 text-white focus:outline-none focus:border-primary transition-all font-mono text-sm resize-none h-20 custom-scrollbar"
                                />
                                <button 
                                    onClick={toggleRecording}
                                    className={`absolute right-3 top-3 w-8 h-8 rounded-full flex items-center justify-center transition-colors ${isRecording ? 'bg-red-500/20 text-red-500 animate-pulse' : 'text-gray-500 hover:text-white bg-white/5'}`}
                                >
                                    <i className="fa-solid fa-microphone"></i>
                                </button>
                            </div>

                            <button 
                                onClick={handleSend}
                                disabled={isTyping || (!input.trim() && !attachedImage && !attachedFile)}
                                className="w-16 h-20 rounded bg-gradient-to-br from-primary to-blue-700 hover:from-primary/80 flex flex-col items-center justify-center text-white disabled:opacity-50 transition-all border border-blue-400/30 shadow-lg shadow-primary/20"
                            >
                                <i className="fa-solid fa-paper-plane mb-1"></i>
                                <span className="text-[10px] tracking-wider uppercase font-bold">EXEC</span>
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        const SecurityCenter = () => {
            return (
                <div className="space-y-6">
                    <div>
                        <h2 className="text-2xl font-bold font-mono tracking-tight text-white border-l-4 border-alert pl-3">Cyber-Security Overwatch</h2>
                        <p className="text-gray-400 text-sm mt-1">Monitoring external threats, dark web exposure, and malware incursions (Simulated).</p>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                        <div className="glass-panel p-6 rounded-xl border border-alert/30 relative overflow-hidden">
                            <div className="absolute -right-4 -top-4 w-24 h-24 bg-alert/10 rounded-full blur-xl"></div>
                            <div className="flex justify-between items-start mb-4 relative z-10">
                                <div>
                                    <div className="text-[10px] text-alert font-bold uppercase tracking-widest mb-1">Dark Web Monitoring</div>
                                    <div className="text-3xl font-mono">0</div>
                                </div>
                                <i className="fa-solid fa-user-secret text-2xl text-alert/50"></i>
                            </div>
                            <div className="text-xs text-gray-400 border-t border-white/5 pt-2">No credential leaks detected in recent scans.</div>
                        </div>

                        <div className="glass-panel p-6 rounded-xl border border-accent/30">
                            <div className="flex justify-between items-start mb-4">
                                <div>
                                    <div className="text-[10px] text-accent font-bold uppercase tracking-widest mb-1">Malware Defense</div>
                                    <div className="text-3xl font-mono">142</div>
                                </div>
                                <i className="fa-solid fa-bug-slash text-2xl text-accent/50"></i>
                            </div>
                            <div className="text-xs text-gray-400 border-t border-white/5 pt-2">Malicious payloads blocked past 30 days.</div>
                        </div>

                        <div className="glass-panel p-6 rounded-xl border border-primary/30">
                            <div className="flex justify-between items-start mb-4">
                                <div>
                                    <div className="text-[10px] text-primary font-bold uppercase tracking-widest mb-1">Phishing Filters</div>
                                    <div className="text-3xl font-mono">99.9%</div>
                                </div>
                                <i className="fa-solid fa-shield-halved text-2xl text-primary/50"></i>
                            </div>
                            <div className="text-xs text-gray-400 border-t border-white/5 pt-2">Inbound comms filtering efficiency.</div>
                        </div>
                    </div>

                    <div className="glass-panel p-6 rounded-xl border border-white/10 font-mono text-sm">
                        <h3 className="text-primary mb-4 border-b border-white/10 pb-2 flex items-center gap-2"><i className="fa-solid fa-terminal"></i> Security Log Output</h3>
                        <div className="bg-black/50 p-4 rounded h-48 overflow-y-auto text-green-400 text-xs space-y-2 font-mono">
                            <div>[15:02:45] SYSTEM: Initializing deep packet inspection on comms relay...</div>
                            <div>[15:02:48] FIREWALL: Blocked unauthorized connection attempt from IP 192.168.x.x</div>
                            <div>[15:03:12] SCANNER: Commencing routine dark web scrape for "Karmanya Project"...</div>
                            <div>[15:03:15] SCANNER: Result Negative. Assets secure.</div>
                            <div className="text-gray-500">_ Awaiting further logs...</div>
                        </div>
                    </div>
                </div>
            );
        };

        const InfoPages = ({ page }) => {
            const content = {
                'home': {
                    title: "Welcome to The CHAVPK Karmanya",
                    body: "The premier advanced telemetry and AI command center for Aero-Exploration. Designed for Airships and Stratospheric balloons, integrating cutting-edge NLP, computer vision, and real-time environmental tracking."
                },
                'about': {
                    title: "About The Project",
                    body: "Karmanya, an ancient Sanskrit word meaning 'skillful in action', reflects our mission. We provide robust, future-ready infrastructure for managing complex aerial fleets. Integrating global tracking, secure comms, and generative AI to solve real-world logistical challenges."
                },
                'faq': {
                    title: "Frequently Asked Questions",
                    body: "Q: Is the system available offline?\nA: Yes, critical telemetry UI states are cached, though live AI functions require connection.\n\nQ: How is data secured?\nA: We utilize Firebase enterprise-grade security rules and simulated dark-web monitoring to ensure mission integrity."
                },
                'privacy': {
                    title: "Privacy Policy",
                    body: "We strictly adhere to global data protection regulations. Location data (GPS), microphone, and camera inputs are processed locally or securely transmitted to our AI core exclusively for your queries. We do not store media permanently without explicit directive."
                },
                'terms': {
                    title: "Terms & Conditions",
                    body: "By accessing the Karmanya terminal, operatives agree to maintain confidentiality of all mission data. Unauthorized distribution of telemetry or AI outputs is strictly prohibited and monitored by the Security Center."
                }
            };
            
            const curr = content[page] || content['home'];

            return (
                <div className="glass-panel p-8 rounded-xl max-w-3xl mx-auto border border-white/10 mt-10 shadow-2xl">
                    <h2 className="text-3xl font-bold mb-6 gradient-text">{curr.title}</h2>
                    <div className="text-gray-300 leading-relaxed whitespace-pre-wrap font-sans text-sm md:text-base">
                        {curr.body}
                    </div>
                    {page === 'privacy' && (
                        <div className="mt-8 p-4 bg-primary/10 border border-primary/20 rounded-lg flex items-start gap-4">
                            <i className="fa-solid fa-lock text-primary text-xl mt-1"></i>
                            <div className="text-xs text-gray-400">
                                This system utilizes browser APIs (navigator.geolocation, navigator.mediaDevices) which request explicit user permission. Data is processed transiently for AI inference.
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const MainApp = ({ user }) => {
            const [currentView, setCurrentView] = useState('dashboard');
            const [userData, setUserData] = useState(null);
            const [sidebarOpen, setSidebarOpen] = useState(true);
            const [consentGiven, setConsentGiven] = useState(false);
            
            // Custom Hooks
            const location = useGeolocation();
            const isOnline = useNetworkStatus();

            useEffect(() => {
                if (!user) return;
                const fetchProfile = async () => {
                    try {
                        const docRef = window.doc(window.firebaseDB, 'artifacts', window.firebaseAppId, 'users', user.uid, 'profile', 'data');
                        const docSnap = await window.getDoc(docRef);
                        if (docSnap.exists()) setUserData(docSnap.data());
                    } catch (e) {
                        console.error("Profile fetch error", e);
                    }
                };
                fetchProfile();
            }, [user]);

            const navItems = [
                { id: 'dashboard', label: 'Aero-Command', icon: 'fa-radar' },
                { id: 'ai', label: 'AI Copilot', icon: 'fa-brain' },
                { id: 'security', label: 'Security Center', icon: 'fa-shield-halved' },
                { id: 'divider', isDivider: true },
                { id: 'home', label: 'Home', icon: 'fa-house' },
                { id: 'about', label: 'About Project', icon: 'fa-circle-info' },
                { id: 'faq', label: 'FAQ', icon: 'fa-circle-question' },
                { id: 'privacy', label: 'Privacy Policy', icon: 'fa-user-lock' },
                { id: 'terms', label: 'Terms', icon: 'fa-file-contract' },
            ];

            const renderContent = () => {
                switch(currentView) {
                    case 'dashboard': return <AeroDashboard location={location} userData={userData} />;
                    case 'ai': return <AdvancedAIAgent userData={userData} location={location} user={user} />;
                    case 'security': return <SecurityCenter />;
                    default: return <InfoPages page={currentView} />;
                }
            };

            return (
                <div className="flex h-screen overflow-hidden bg-darker font-sans text-gray-200">
                    {/* Compliance & Cookie Consent Banner */}
                    {!consentGiven && (
                        <div className="absolute bottom-0 left-0 w-full z-50 bg-dark border-t border-primary/50 p-4 shadow-2xl flex flex-col md:flex-row items-center justify-between gap-4">
                            <div className="text-xs text-gray-300">
                                <i className="fa-solid fa-shield-halved text-primary mr-2"></i>
                                <strong>Privacy Notice:</strong> Karmanya uses advanced telemetry and cloud synchronization compliant with GDPR & CCPA. We process localized inputs (audio/visual) solely for AI directives. No mission data is shared externally.
                            </div>
                            <div className="flex gap-3 shrink-0">
                                <button onClick={() => setCurrentView('privacy')} className="text-xs text-primary hover:underline uppercase tracking-widest font-mono">Review Policy</button>
                                <button onClick={() => setConsentGiven(true)} className="bg-primary hover:bg-blue-600 text-white px-4 py-2 rounded text-xs uppercase tracking-widest font-bold transition-colors">Acknowledge</button>
                            </div>
                        </div>
                    )}

                    {/* Offline Warning Banner */}
                    {!isOnline && (
                        <div className="absolute top-0 left-0 w-full z-50 bg-red-600 text-white text-center text-xs py-1 font-mono font-bold tracking-widest animate-pulse">
                            CRITICAL: NETWORK CONNECTION LOST. OPERATING IN OFFLINE CACHE MODE.
                        </div>
                    )}

                    {/* Sidebar */}
                    <div className={`glass-panel border-r border-white/5 transition-all duration-300 z-30 ${sidebarOpen ? 'w-64' : 'w-0 -translate-x-full md:w-20 md:translate-x-0'} flex flex-col absolute md:relative h-full`}>
                        <div className="p-4 flex items-center justify-between border-b border-white/10 h-16 shrink-0">
                            {sidebarOpen && <div className="font-bold text-lg overflow-hidden whitespace-nowrap">
                                <span className="text-white font-mono tracking-tighter">KARMANYA</span>
                            </div>}
                            <button onClick={() => setSidebarOpen(!sidebarOpen)} className="text-gray-400 hover:text-white md:hidden ml-auto">
                                <i className="fa-solid fa-xmark"></i>
                            </button>
                        </div>
                        
                        <div className="flex-1 py-4 overflow-y-auto custom-scrollbar flex flex-col gap-1 px-3">
                            {navItems.map((item, idx) => {
                                if (item.isDivider) return <div key={idx} className="h-px bg-white/10 my-2 mx-2"></div>;
                                return (
                                    <button 
                                        key={item.id}
                                        onClick={() => { setCurrentView(item.id); if(window.innerWidth < 768) setSidebarOpen(false); }}
                                        className={`w-full flex items-center gap-3 px-3 py-2.5 rounded transition-all font-mono text-sm ${
                                            currentView === item.id 
                                                ? 'bg-primary/20 text-white border-l-2 border-primary' 
                                                : 'text-gray-400 hover:bg-white/5 hover:text-gray-200 border-l-2 border-transparent'
                                        }`}
                                    >
                                        <i className={`fa-solid ${item.icon} w-5 text-center ${currentView === item.id ? 'text-primary' : ''}`}></i>
                                        {sidebarOpen && <span>{item.label}</span>}
                                    </button>
                                );
                            })}
                        </div>

                        <div className="p-4 border-t border-white/10 shrink-0 bg-black/20">
                            <div className="flex items-center gap-3">
                                <div className="w-10 h-10 rounded border border-gray-600 flex items-center justify-center font-bold text-lg text-primary overflow-hidden bg-dark">
                                    {userData?.name ? userData.name.charAt(0).toUpperCase() : 'O'}
                                </div>
                                {sidebarOpen && (
                                    <div className="overflow-hidden font-mono">
                                        <div className="text-xs font-bold text-white truncate">{userData?.name || 'Loading...'}</div>
                                        <div className="text-[10px] text-gray-500 truncate">{userData?.role || '...'}</div>
                                    </div>
                                )}
                            </div>
                        </div>
                    </div>

                    {/* Main Content Area */}
                    <div className="flex-1 flex flex-col h-screen relative overflow-hidden bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-dark via-darker to-black">
                        {/* Topbar */}
                        <header className="h-16 border-b border-white/5 flex items-center px-6 justify-between z-10 bg-darker/50 backdrop-blur-md">
                            <div className="flex items-center gap-4">
                                <button onClick={() => setSidebarOpen(!sidebarOpen)} className="text-gray-400 hover:text-white transition-colors">
                                    <i className="fa-solid fa-bars text-lg"></i>
                                </button>
                                <div className="font-mono text-xs text-gray-400 hidden md:block tracking-widest uppercase">
                                    Terminal / <span className="text-primary">{navItems.find(i => i.id === currentView)?.label}</span>
                                </div>
                            </div>
                            
                            <div className="flex items-center gap-4">
                                <div className="hidden sm:flex items-center gap-2 text-[10px] font-mono border border-white/10 px-2 py-1 rounded bg-black/30">
                                    <i className={`fa-solid fa-wifi ${isOnline ? 'text-green-400' : 'text-red-500'}`}></i>
                                    {isOnline ? 'UPLINK OK' : 'NO UPLINK'}
                                </div>
                                <button onClick={() => window.location.reload()} className="text-[10px] font-mono text-alert hover:text-red-300 transition-colors border border-alert/30 px-2 py-1 rounded uppercase tracking-widest">
                                    End Session
                                </button>
                            </div>
                        </header>

                        {/* Content Scrollable Area */}
                        <main className="flex-1 overflow-y-auto custom-scrollbar p-4 md:p-6 relative z-0">
                            <div className="max-w-7xl mx-auto h-full">
                                {renderContent()}
                            </div>
                        </main>
                    </div>
                </div>
            );
        };

        const App = () => {
            const [user, setUser] = useState(null);
            const [loading, setLoading] = useState(true);

            useEffect(() => {
                const checkFirebase = setInterval(() => {
                    if (window.firebaseAuth) {
                        clearInterval(checkFirebase);
                        window.firebaseAuth.onAuthStateChanged((currUser) => {
                            if (currUser) setUser(currUser);
                            setLoading(false);
                        });
                    }
                }, 100);
                return () => clearInterval(checkFirebase);
            }, []);

            if (loading) {
                return (
                    <div className="h-screen w-screen flex flex-col items-center justify-center bg-darker">
                        <div className="relative w-24 h-24 mb-6">
                            <div className="loader w-full h-full border-t-primary border-4 absolute inset-0"></div>
                            <i className="fa-solid fa-rocket text-3xl text-primary absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2"></i>
                        </div>
                        <h2 className="text-sm font-mono tracking-[0.3em] text-gray-400">BOOTING KARMANYA CORE</h2>
                    </div>
                );
            }

            return user ? <MainApp user={user} /> : <AuthScreen onLogin={setUser} />;
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
