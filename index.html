    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc, updateDoc, collection, onSnapshot, serverTimestamp, query, getDocs } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const appId = typeof __app_id !== 'undefined' ? __app_id : 'chavpk-aero-dev-v2';
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {};
        
        let app, db, auth;
        try {
            app = initializeApp(firebaseConfig);
            db = getFirestore(app);
            auth = getAuth(app);
            
            // Expose globally for React to consume
            window.firebaseDB = db;
            window.firebaseAuth = auth;
            window.firebaseAppId = appId;
            window.signInAnonymously = signInAnonymously;
            window.signInWithCustomToken = signInWithCustomToken;
            window.doc = doc;
            window.getDoc = getDoc;
            window.setDoc = setDoc;
            window.serverTimestamp = serverTimestamp;
        } catch (e) {
            console.error("Firebase Init Error:", e);
        }
    </script>

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo } = React;

        const DEPARTMENTS = ["Aero-Exploration", "Quantum Avionics", "Predictive Meteorology", "Blockchain C&C", "Cyber Warfare Defense"];
        const JOB_ROLES = {
            "Aero-Exploration": ["Chief Aeronaut", "Stratospheric Surveyor", "Orbital Analyst"],
            "Quantum Avionics": ["Propulsion Engineer", "Q-Systems Architect"],
            "Predictive Meteorology": ["AI Weather Router", "Atmospheric Physicist"],
            "Blockchain C&C": ["Ledger Commander", "Encrypted Comms Officer"],
            "Cyber Warfare Defense": ["Dark Web Monitor", "Quantum Encryption Lead"]
        };

        // --- UTILITY HOOKS ---
        const useGeolocation = () => {
            const [location, setLocation] = useState({ lat: null, lng: null, error: null, loading: true });
            useEffect(() => {
                if (!navigator.geolocation) {
                    setLocation({ lat: null, lng: null, error: "Geolocation not supported", loading: false });
                    return;
                }
                const watchId = navigator.geolocation.watchPosition(
                    (position) => setLocation({ lat: position.coords.latitude, lng: position.coords.longitude, error: null, loading: false }),
                    (error) => setLocation({ lat: null, lng: null, error: error.message, loading: false }),
                    { enableHighAccuracy: true, timeout: 5000, maximumAge: 0 }
                );
                return () => navigator.geolocation.clearWatch(watchId);
            }, []);
            return location;
        };

        const useNetworkStatus = () => {
            const [isOnline, setIsOnline] = useState(navigator.onLine);
            useEffect(() => {
                const handleOnline = () => setIsOnline(true);
                const handleOffline = () => setIsOnline(false);
                window.addEventListener('online', handleOnline);
                window.addEventListener('offline', handleOffline);
                return () => {
                    window.removeEventListener('online', handleOnline);
                    window.removeEventListener('offline', handleOffline);
                };
            }, []);
            return isOnline;
        };

        const AuthScreen = ({ onLogin }) => {
            const [isRegister, setIsRegister] = useState(false);
            const [loading, setLoading] = useState(false);
            const [error, setError] = useState("");
            const [formData, setFormData] = useState({ name: "", email: "", department: DEPARTMENTS[0], role: JOB_ROLES[DEPARTMENTS[0]][0] });

            useEffect(() => setFormData(prev => ({ ...prev, role: JOB_ROLES[prev.department][0] })), [formData.department]);

            const handleAuth = async (e) => {
                e.preventDefault();
                setLoading(true); setError("");
                try {
                    const auth = window.firebaseAuth;
                    let userCredential;
                    if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                         userCredential = await window.signInWithCustomToken(auth, __initial_auth_token);
                    } else {
                         userCredential = await window.signInAnonymously(auth);
                    }
                    const user = userCredential.user;
                    if (isRegister) {
                        const userRef = window.doc(window.firebaseDB, 'artifacts', window.firebaseAppId, 'users', user.uid, 'profile', 'data');
                        await window.setDoc(userRef, {
                            name: formData.name || "Unknown Operative",
                            email: formData.email,
                            department: formData.department,
                            role: formData.role,
                            createdAt: window.serverTimestamp(),
                            clearanceLevel: "Quantum Level 9"
                        });
                    }
                    onLogin(user);
                } catch (err) {
                    setError("Quantum Handshake Failed. Verify Network Integrity.");
                } finally { setLoading(false); }
            };

            return (
                <div className="min-h-screen flex items-center justify-center bg-darker relative overflow-hidden bg-quantum-grid">
                    <div className="absolute top-0 left-1/2 -translate-x-1/2 w-[800px] h-[400px] bg-primary/20 rounded-full blur-[120px] pointer-events-none"></div>
                    
                    <div className="glass-panel p-8 rounded-2xl w-full max-w-md z-10 border border-quantum/30 shadow-[0_0_50px_rgba(6,182,212,0.15)] relative overflow-hidden">
                        <div className="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-primary via-quantum to-secondary"></div>
                        
                        <div className="text-center mb-8 pt-4">
                            <i className="fa-brands fa-space-awesome text-5xl text-quantum mb-4 animate-pulse"></i>
                            <h1 className="text-3xl font-bold tracking-tight">KARMANYA <span className="font-light text-gray-400">OS</span></h1>
                            <p className="text-quantum text-[10px] tracking-[0.3em] uppercase mt-2 font-mono">Quantum-Secured Aerospace Telemetry</p>
                        </div>
                        
                        {error && <div className="bg-alert/10 border border-alert/50 text-alert p-3 rounded mb-4 text-xs font-mono text-center">{error}</div>}

                        <form onSubmit={handleAuth} className="space-y-5">
                            {isRegister && (
                                <div className="space-y-4">
                                    <div>
                                        <label className="block text-[10px] text-gray-400 mb-1 uppercase tracking-widest font-mono">Operative Designation</label>
                                        <input type="text" required value={formData.name} onChange={e => setFormData({...formData, name: e.target.value})} className="w-full bg-black/50 border border-white/10 rounded p-3 text-white focus:outline-none focus:border-quantum transition-colors font-mono text-sm" placeholder="Cmdr. Shepard" />
                                    </div>
                                    <div className="grid grid-cols-2 gap-4">
                                        <div>
                                            <label className="block text-[10px] text-gray-400 mb-1 uppercase tracking-widest font-mono">Division</label>
                                            <select value={formData.department} onChange={e => setFormData({...formData, department: e.target.value})} className="w-full bg-black/50 border border-white/10 rounded p-3 text-white focus:outline-none focus:border-quantum transition-colors text-xs font-mono appearance-none">
                                                {DEPARTMENTS.map(d => <option key={d} value={d}>{d}</option>)}
                                            </select>
                                        </div>
                                        <div>
                                            <label className="block text-[10px] text-gray-400 mb-1 uppercase tracking-widest font-mono">Role</label>
                                            <select value={formData.role} onChange={e => setFormData({...formData, role: e.target.value})} className="w-full bg-black/50 border border-white/10 rounded p-3 text-white focus:outline-none focus:border-quantum transition-colors text-xs font-mono appearance-none">
                                                {JOB_ROLES[formData.department].map(r => <option key={r} value={r}>{r}</option>)}
                                            </select>
                                        </div>
                                    </div>
                                </div>
                            )}
                            
                            <button type="submit" disabled={loading} className="w-full bg-white/5 hover:bg-quantum/20 text-white font-mono border border-quantum/50 py-3.5 rounded transition-all flex items-center justify-center uppercase tracking-widest text-sm relative group overflow-hidden">
                                <span className="absolute w-0 h-full bg-quantum/20 left-0 top-0 transition-all group-hover:w-full ease-out duration-300 -z-10"></span>
                                {loading ? <div className="loader"></div> : (isRegister ? "Initialize Ledger Identity" : "Establish Secure Uplink")}
                            </button>
                        </form>

                        <div className="mt-6 text-center border-t border-white/10 pt-4">
                            <button onClick={() => setIsRegister(!isRegister)} className="text-[10px] text-gray-500 hover:text-quantum transition-colors font-mono tracking-widest uppercase">
                                {isRegister ? "[ Proceed to Authentication ]" : "[ Register New Identity Node ]"}
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        const AeroDashboard = ({ location, userData }) => {
            return (
                <div className="space-y-6 h-full flex flex-col">
                    <div className="flex flex-col lg:flex-row gap-6 h-full min-h-[500px]">
                        <div className="flex-1 glass-panel rounded-xl p-6 relative overflow-hidden flex flex-col border border-primary/20 bg-[url('https://www.transparenttextures.com/patterns/cubes.png')]">
                            
                            <div className="relative z-10 flex justify-between items-start mb-6">
                                <div>
                                    <h2 className="text-2xl font-bold tracking-tight">Global Aero-Telemetry</h2>
                                    <div className="text-quantum font-mono text-xs mt-1">QUANTUM-ENCRYPTED LIVE TRACKING</div>
                                </div>
                                <span className="px-3 py-1 bg-green-500/10 text-green-400 text-[10px] rounded border border-green-500/30 font-mono flex items-center gap-2">
                                    <div className="w-1.5 h-1.5 bg-green-400 rounded-full animate-pulse"></div> SAT-LINK SECURE
                                </span>
                            </div>

                            <div className="flex-1 relative flex items-center justify-center border border-white/5 rounded-lg bg-black/40 overflow-hidden my-4">
                                <div className="absolute w-[150%] h-[150%] radar-scan opacity-30"></div>
                                <div className="w-64 h-64 border border-quantum/30 rounded-full relative">
                                    <div className="absolute inset-[15%] border border-quantum/20 rounded-full"></div>
                                    <div className="absolute inset-[35%] border border-quantum/10 rounded-full"></div>
                                    
                                    <div className="absolute top-[25%] left-[65%] text-accent text-[10px] flex flex-col items-center">
                                        <i className="fa-solid fa-plane text-accent mb-1 animate-pulse"></i> A-Vanguard
                                    </div>
                                    <div className="absolute bottom-[30%] left-[20%] text-secondary text-[10px] flex flex-col items-center">
                                        <i className="fa-solid fa-parachute-box text-secondary mb-1"></i> S-Balloon-Alpha
                                    </div>
                                </div>
                            </div>

                            <div className="grid grid-cols-2 md:grid-cols-4 gap-4 mt-auto">
                                <div className="bg-black/50 border border-white/5 p-3 rounded">
                                    <div className="text-[9px] text-gray-500 uppercase tracking-widest mb-1 font-mono">Local Node Coords</div>
                                    <div className="font-mono text-xs text-white">
                                        {location.loading ? "CALCULATING..." : 
                                         (location.error || location.lat === null || location.lng === null) ? "ENCRYPTION BLOCK" : 
                                         `${location.lat.toFixed(4)}°, ${location.lng.toFixed(4)}°`}
                                    </div>
                                </div>
                                <div className="bg-black/50 border border-white/5 p-3 rounded">
                                    <div className="text-[9px] text-gray-500 uppercase tracking-widest mb-1 font-mono">Mean Altitude</div>
                                    <div className="font-mono text-xs text-quantum">45,200 FT MSL</div>
                                </div>
                                <div className="bg-black/50 border border-white/5 p-3 rounded">
                                    <div className="text-[9px] text-gray-500 uppercase tracking-widest mb-1 font-mono">Atmospheric Var</div>
                                    <div className="font-mono text-xs text-secondary">STABLE (0.02)</div>
                                </div>
                                <div className="bg-black/50 border border-white/5 p-3 rounded">
                                    <div className="text-[9px] text-gray-500 uppercase tracking-widest mb-1 font-mono">Blockchain Sync</div>
                                    <div className="font-mono text-xs text-accent">100% VALIDATED</div>
                                </div>
                            </div>
                        </div>

                        <div className="w-full lg:w-80 flex flex-col gap-6">
                            <div className="glass-panel p-5 rounded-xl border border-white/10 flex-1">
                                <h3 className="text-xs font-bold uppercase tracking-widest text-gray-400 mb-4 border-b border-white/10 pb-2">Active Assets</h3>
                                <div className="space-y-3">
                                    {['Aether-Vanguard (Zeppelin)', 'Nimbus-Core (B-Class)', 'Strato-Probe MK-IX'].map((asset, i) => (
                                        <div key={i} className="flex justify-between items-center bg-black/40 border border-white/5 p-3 rounded">
                                            <div className="flex items-center gap-3">
                                                <i className={`fa-solid ${i===0?'fa-plane':i===1?'fa-parachute-box':'fa-satellite'} text-quantum text-sm`}></i>
                                                <span className="text-[11px] font-mono text-gray-300">{asset}</span>
                                            </div>
                                            <div className="w-1.5 h-1.5 rounded-full bg-green-500 shadow-[0_0_5px_#22c55e]"></div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                            
                            <div className="glass-panel p-5 rounded-xl border border-quantum/30 bg-gradient-to-br from-dark to-quantum/10">
                                <h3 className="text-xs font-bold uppercase tracking-widest text-quantum mb-2">Mission Protocol</h3>
                                <p className="text-[11px] text-gray-400 mb-4 font-mono leading-relaxed">Executing decentralized atmospheric surveillance utilizing NLP models to parse global weather patterns securely via blockchain ledger.</p>
                                <div className="flex gap-2 flex-wrap">
                                    <span className="text-[9px] font-mono bg-quantum/20 text-quantum border border-quantum/30 px-2 py-1 rounded">METEOROLOGY-AI</span>
                                    <span className="text-[9px] font-mono bg-secondary/20 text-secondary border border-secondary/30 px-2 py-1 rounded">CRYPTO-UPLINK</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const AdvancedAIAgent = ({ user, userData, location }) => {
            const [messages, setMessages] = useState([]);
            const [input, setInput] = useState('');
            const [isTyping, setIsTyping] = useState(false);
            const [isRecording, setIsRecording] = useState(false);
            
            const messagesEndRef = useRef(null);

            useEffect(() => {
                if (!user) return;
                const loadHistory = async () => {
                    try {
                        const docRef = window.doc(window.firebaseDB, 'artifacts', window.firebaseAppId, 'users', user.uid, 'chats', 'main');
                        const docSnap = await window.getDoc(docRef);
                        if (docSnap.exists() && docSnap.data().messages) {
                            setMessages(docSnap.data().messages);
                        } else {
                            setMessages([{ role: 'model', text: `Quantum NLP Engine Online. Awaiting directives from ${userData?.role || 'Operative'} [ID: ${userData?.name || 'Unknown'}]. Data streams are end-to-end encrypted.`, isGreeting: true }]);
                        }
                    } catch (e) {
                        setMessages([{ role: 'model', text: `LOCAL CACHE MODE: Quantum Sync Failed. Basic NLP active.`, isAlert: true }]);
                    }
                };
                loadHistory();
            }, [user, userData]);

            const saveToCloud = async (newMessages) => {
                if (!user) return;
                try {
                    const docRef = window.doc(window.firebaseDB, 'artifacts', window.firebaseAppId, 'users', user.uid, 'chats', 'main');
                    await window.setDoc(docRef, { messages: newMessages, lastUpdated: window.serverTimestamp() }, { merge: true });
                } catch (e) { console.error("Sync Error", e); }
            };

            const scrollToBottom = () => messagesEndRef.current?.scrollIntoView({ behavior: "smooth" });
            useEffect(() => { scrollToBottom(); }, [messages, isTyping]);

            const handleSend = async () => {
                if (!input.trim()) return;
                
                let userText = input.trim();
                const newMessages = [...messages, { role: 'user', text: userText }];
                
                setMessages(newMessages);
                saveToCloud(newMessages);
                setInput('');
                setIsTyping(true);

                try {
                    const sysPrompt = `Act as Karmanya AI, a highly advanced NLP agent running on a quantum processor managing aerospace fleets. User: ${userData?.name}. Use technical, precise language incorporating terms like blockchain, telemetry, encryption, and stratospheric analytics. Keep responses concise and structured.`;

                    // Filter out local alerts and initial greetings from the history to prevent confusion
                    let validHistory = newMessages.filter(msg => !msg.isAlert && !msg.isGreeting);
                    
                    // Gemini strictly requires roles to alternate (user, model, user, model).
                    const apiContents = [];
                    let lastRole = null;
                    
                    for (const msg of validHistory) {
                        const currentRole = msg.role === 'model' ? 'model' : 'user';
                        
                        // Enforce 'user' as the starting role for multi-turn history
                        if (apiContents.length === 0 && currentRole === 'model') continue;
                        
                        // Merge consecutive messages from the same role to satisfy API requirements
                        if (currentRole === lastRole) {
                            apiContents[apiContents.length - 1].parts[0].text += `\n\n${msg.text}`;
                        } else {
                            apiContents.push({ role: currentRole, parts: [{ text: msg.text }] });
                            lastRole = currentRole;
                        }
                    }
                    
                    // Fallback to guarantee at least one user message is passed
                    if (apiContents.length === 0) {
                        apiContents.push({ role: 'user', parts: [{ text: userText }] });
                    }

                    const payload = { contents: apiContents, systemInstruction: { parts: [{ text: sysPrompt }] } };
                    const apiKey = ""; 
                    const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;

                    const response = await fetch(apiUrl, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
                    
                    if (!response.ok) {
                        const errorDetails = await response.json().catch(() => ({}));
                        console.error("Gemini API Status Error:", errorDetails);
                        throw new Error(`Connection fault (${response.status})`);
                    }

                    const result = await response.json();
                    
                    if (result.candidates?.[0]?.content?.parts?.[0]?.text) {
                        const finalMessages = [...newMessages, { role: 'model', text: result.candidates[0].content.parts[0].text }];
                        setMessages(finalMessages);
                        saveToCloud(finalMessages);
                    } else { 
                        throw new Error("Invalid format received from Quantum Node"); 
                    }
                } catch (error) {
                    console.error("NLP Generation Error:", error);
                    const errorMsgs = [...newMessages, { role: 'model', text: `SYSTEM FAULT: NLP Node disconnected. Reason: ${error.message}. Blockchain verification pending.`, isAlert: true }];
                    setMessages(errorMsgs);
                    saveToCloud(errorMsgs);
                } finally { setIsTyping(false); }
            };

            return (
                <div className="h-full flex flex-col glass-panel rounded-xl overflow-hidden border border-quantum/20">
                    <div className="bg-black/60 border-b border-white/10 p-4 flex items-center justify-between shrink-0">
                        <div className="flex items-center gap-3">
                            <div className="w-10 h-10 rounded bg-dark border border-quantum/50 flex items-center justify-center relative shadow-[0_0_15px_rgba(6,182,212,0.2)]">
                                <i className="fa-solid fa-microchip text-quantum"></i>
                            </div>
                            <div>
                                <h3 className="font-bold tracking-tight text-sm">NLP Copilot Model</h3>
                                <div className="text-[10px] text-quantum font-mono tracking-widest uppercase">Quantum Encrypted Processing</div>
                            </div>
                        </div>
                    </div>

                    <div className="flex-1 overflow-y-auto p-4 space-y-4 custom-scrollbar bg-dark/50">
                        {messages.map((msg, idx) => (
                            <div key={idx} className={`flex ${msg.role === 'user' ? 'justify-end' : 'justify-start'}`}>
                                <div className={`max-w-[85%] sm:max-w-[70%] rounded-lg p-4 ${
                                    msg.role === 'user' 
                                        ? 'bg-quantum/10 border border-quantum/30 text-white' 
                                        : msg.isAlert 
                                            ? 'bg-alert/10 border border-alert/50 text-alert font-mono text-xs'
                                            : 'bg-black/80 border border-white/10 text-gray-300 font-sans text-sm'
                                }`}>
                                    <div className={`text-[9px] mb-2 uppercase tracking-widest border-b pb-1 flex justify-between font-mono ${msg.isAlert ? 'border-alert/20' : 'text-gray-500 border-white/5'}`}>
                                        <span>{msg.role === 'user' ? 'USER UPLINK' : 'AI RESPONSE'}</span>
                                    </div>
                                    <div className="leading-relaxed whitespace-pre-wrap text-sm">{msg.text}</div>
                                </div>
                            </div>
                        ))}
                        {isTyping && (
                            <div className="flex justify-start">
                                <div className="bg-black/80 border border-white/10 rounded-lg p-4 font-mono text-xs text-quantum flex gap-2 items-center">
                                    <i className="fa-solid fa-circle-notch fa-spin"></i> Processing via Neural Net...
                                </div>
                            </div>
                        )}
                        <div ref={messagesEndRef} />
                    </div>

                    <div className="p-4 bg-black/80 border-t border-white/10 shrink-0">
                        <div className="flex items-end gap-2">
                            <textarea 
                                value={input}
                                onChange={e => setInput(e.target.value)}
                                onKeyDown={e => { if(e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); handleSend(); } }}

                                className="flex-1 bg-dark/50 border border-white/10 rounded py-3 px-4 text-white focus:outline-none focus:border-quantum transition-all font-mono text-sm resize-none h-14 custom-scrollbar"
                            />
                            <button 
                                onClick={handleSend}
                                disabled={isTyping || !input.trim()}

                            >
                                <i className="fa-solid fa-paper-plane mr-2"></i> Transmit
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        const SecurityCenter = () => {
            return (
                <div className="space-y-6 h-full overflow-y-auto custom-scrollbar pr-2">
                    <div>
                        <h2 className="text-2xl font-bold font-mono tracking-tight text-white border-l-4 border-alert pl-4 py-1">Security & Integrity Overwatch</h2>
                        <p className="text-gray-400 text-xs mt-2 font-mono">Monitoring Quantum Encryption, Blockchain Nodes, and Dark Web threat vectors.</p>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                        <div className="glass-panel p-6 rounded-xl border border-quantum/40 relative overflow-hidden bg-black/40">
                            <div className="absolute -right-4 -top-4 w-24 h-24 bg-quantum/10 rounded-full blur-xl"></div>
                            <div className="flex justify-between items-start mb-4 relative z-10">
                                <div>
                                    <div className="text-[10px] text-quantum font-bold uppercase tracking-widest mb-1 font-mono">Quantum Encryption</div>

                                </div>
                                <i className="fa-solid fa-microchip text-2xl text-quantum/50"></i>
                            </div>
                            <div className="text-[10px] font-mono text-gray-400 border-t border-white/5 pt-2 flex items-center gap-2">
                                <div className="w-1.5 h-1.5 bg-quantum rounded-full shadow-[0_0_5px_#06b6d4]"></div> Keys rotating normally.
                            </div>
                        </div>

                        <div className="glass-panel p-6 rounded-xl border border-secondary/40 bg-black/40">
                            <div className="flex justify-between items-start mb-4">
                                <div>
                                    <div className="text-[10px] text-secondary font-bold uppercase tracking-widest mb-1 font-mono">Blockchain Ledger</div>
                                    <div className="text-2xl font-mono">SYNCED</div>
                                </div>
                                <i className="fa-brands fa-hive text-2xl text-secondary/50"></i>
                            </div>
                            <div className="text-[10px] font-mono text-gray-400 border-t border-white/5 pt-2">Distributed nodes verifying telemetry.</div>
                        </div>

                        <div className="glass-panel p-6 rounded-xl border border-alert/40 bg-black/40">
                            <div className="flex justify-between items-start mb-4">
                                <div>
                                    <div className="text-[10px] text-alert font-bold uppercase tracking-widest mb-1 font-mono">Dark Web Scrape</div>
                                    <div className="text-2xl font-mono">0 THREATS</div>
                                </div>
                                <i className="fa-solid fa-user-secret text-2xl text-alert/50"></i>
                            </div>
                            <div className="text-[10px] font-mono text-gray-400 border-t border-white/5 pt-2">No credential leaks detected across monitored networks.</div>
                        </div>
                    </div>

                    <div className="glass-panel p-6 rounded-xl border border-white/10 font-mono text-xs bg-black/60">
                        <h3 className="text-gray-300 mb-4 border-b border-white/10 pb-3 flex items-center gap-2 font-bold tracking-widest uppercase"><i className="fa-solid fa-terminal text-quantum"></i> Live Audit Log</h3>
                        <div className="p-4 rounded h-48 overflow-y-auto text-green-500/80 space-y-3 custom-scrollbar">
                            <div>[SYS-TIME]: Initializing Quantum Packet Inspection...</div>
                            <div>[SYS-TIME]: Verifying Ledger Block #849201... <span className="text-quantum">SUCCESS</span></div>
                            <div className="text-alert/80">[SYS-TIME]: FIREWALL - Deflected port scan from proxy node [REDACTED].</div>
                            <div>[SYS-TIME]: NLP Module permissions verified via smart contract.</div>
                            <div>[SYS-TIME]: Routine Dark Web OSINT sweep completed. Result: Clean.</div>
                            <div className="text-gray-500 animate-pulse">_ Awaiting real-time events...</div>
                        </div>
                    </div>
                </div>
            );
        };

        const InfoPages = ({ page }) => {
            const content = {
                'home': {
                    title: "Karmanya OS: Next-Gen Core",
                    paragraphs: [
                        "Welcome to the CHAVPK Karmanya Core. This terminal provides highly restricted access to our commercial aerospace fleet management systems. By logging in, you have entered a zero-trust network environment.",
                        "Our architecture utilizes Quantum-level encryption protocols and a decentralized Blockchain management system to ensure that every piece of telemetry, from stratospheric balloons to heavy-lift zeppelins, is immutable and completely secure from interception.",
                        "Explore the 'External Features' via the Aero Command navigation to access Advanced NLP AI Copilots, Live Global Radar mappings, and comprehensive Deep-Web Threat Monitoring dashboards designed for elite Operatives."
                    ]
                },
                'about': {
                    title: "System Architecture & Origin",
                    paragraphs: [
                        "Karmanya, derived from ancient texts implying 'skillful in action', represents the pinnacle of modern aerospace logistics software. We bridge the gap between high-altitude hardware and ground-side artificial intelligence.",
                        "Our platform is built to be future-ready and commercial-use viable. By integrating various latest AI/ML modules and Natural Language Processing (NLP) capabilities, we allow operators to control complex fleet logistics using conversational, human-like directives.",
                        "The backbone of this system relies on a hybrid cloud-blockchain ledger, ensuring that data integrity is maintained even in the face of sophisticated cyber warfare attempts."
                    ]
                },
                'faq': {
                    title: "Operative FAQs",
                    paragraphs: [
                        "Q: Is the system capable of operating offline?\nA: Yes, critical UI states and localized telemetry are cached. However, processing heavy NLP queries requires a connection to the Quantum AI Core.",
                        "Q: How is data secured against modern threats?\nA: We employ highly advanced Quantum-resistant algorithms coupled with Firebase enterprise rules. Our Security Center actively monitors the dark web for specific project identifiers to preempt attacks.",
                        "Q: Can the NLP model handle complex meteorological data?\nA: Absolutely. The AI Copilot is trained on vast datasets of predictive meteorology and can parse complex weather routing scenarios instantly."
                    ]
                },
                'privacy': {
                    title: "Strict Privacy Protocol",
                    paragraphs: [
                        "As a commercial and potentially classified operations platform, Karmanya OS adheres to the strictest global data protection mandates. We operate under a 'need-to-know' data collection policy.",
                        "Location data (GPS) is processed locally to adjust radar views and is only transmitted via encrypted blockchain ledgers when explicitly requested for asset routing.",
                        "Interactions with the NLP AI Copilot are end-to-end encrypted. Audio/Visual inputs are processed transiently for inference and are never stored on permanent databases without a secondary smart-contract authorization."
                    ]
                },
                'terms': {
                    title: "Terms of Engagement",
                    paragraphs: [
                        "By accessing the Karmanya terminal, operatives agree to maintain the absolute confidentiality of all mission data, UI layouts, and AI outputs. You are entering a legally binding agreement to protect system assets.",
                        "Unauthorized distribution, reverse-engineering of the Quantum Encryption modules, or attempts to manipulate the Blockchain ledger will result in immediate termination of access and potential legal prosecution.",
                        "The system is provided 'as-is' for authorized commercial use. Administrators reserve the right to throttle NLP usage or disconnect nodes displaying anomalous behavior."
                    ]
                }
            };
            
            const curr = content[page] || content['home'];

            return (
                <div className="glass-panel p-8 md:p-12 rounded-2xl max-w-4xl mx-auto border border-white/10 shadow-2xl h-full overflow-y-auto custom-scrollbar bg-black/40">
                    <h2 className="text-3xl md:text-4xl font-bold mb-8 gradient-text tracking-tight">{curr.title}</h2>
                    <div className="space-y-6 text-gray-300 leading-relaxed font-sans text-sm md:text-base">
                        {curr.paragraphs.map((para, idx) => (
                            <p key={idx} className="whitespace-pre-wrap">{para}</p>
                        ))}
                    </div>
                    {page === 'privacy' && (
                        <div className="mt-10 p-5 bg-quantum/10 border border-quantum/30 rounded-xl flex items-start gap-4">
                            <i className="fa-solid fa-lock text-quantum text-2xl mt-1"></i>
                            <div className="text-sm text-gray-400 font-mono leading-relaxed">
                                QUANTUM COMPLIANCE: This system utilizes browser APIs which request explicit permission. Data streams undergo quantum-resistant obfuscation before reaching cloud servers.
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const MainApp = ({ user }) => {
            // Default to 'home' as requested
            const [currentView, setCurrentView] = useState('home');
            const [userData, setUserData] = useState(null);
            // Default sidebar closed, only opened by Aero Command button
            const [sidebarOpen, setSidebarOpen] = useState(false); 
            
            const location = useGeolocation();
            const isOnline = useNetworkStatus();

            useEffect(() => {
                if (!user) return;
                const fetchProfile = async () => {
                    const docRef = window.doc(window.firebaseDB, 'artifacts', window.firebaseAppId, 'users', user.uid, 'profile', 'data');
                    const docSnap = await window.getDoc(docRef);
                    if (docSnap.exists()) setUserData(docSnap.data());
                };
                fetchProfile();
            }, [user]);

            const navItems = [
                { id: 'home', label: 'Home Node', icon: 'fa-house' },
                { id: 'dashboard', label: 'Global Radar', icon: 'fa-radar' },
                { id: 'ai', label: 'NLP Copilot', icon: 'fa-brain' },
                { id: 'security', label: 'Security Center', icon: 'fa-shield-halved' },
                { id: 'divider1', isDivider: true },
                { id: 'about', label: 'Architecture', icon: 'fa-microchip' },
                { id: 'faq', label: 'Operative FAQ', icon: 'fa-circle-question' },
                { id: 'privacy', label: 'Privacy Protocol', icon: 'fa-user-lock' },
                { id: 'terms', label: 'Terms of Ops', icon: 'fa-file-contract' },
            ];

            return (
                <div className="flex h-screen overflow-hidden bg-darker font-sans text-gray-200">
                    
                    {/* Offline Banner */}
                    {!isOnline && (
                        <div className="absolute top-0 left-0 w-full z-50 bg-alert/90 text-white text-center text-[10px] py-1 font-mono font-bold tracking-widest">
                            WARNING: QUANTUM LINK SEVERED. OFFLINE CACHE ACTIVE.
                        </div>
                    )}

                    {/* Sidebar Nav (Hidden by default, controlled by state) */}
                    <div className={`fixed inset-y-0 left-0 z-40 w-64 glass-panel border-r border-white/10 transform transition-transform duration-300 ease-in-out flex flex-col bg-black/90 ${sidebarOpen ? 'translate-x-0' : '-translate-x-full'}`}>
                        <div className="p-5 flex items-center justify-between border-b border-white/10 h-16 shrink-0 bg-darker/50">
                            <div className="font-bold text-lg text-white font-mono tracking-tighter flex items-center gap-2">
                                <i className="fa-brands fa-space-awesome text-quantum"></i> KARMANYA
                            </div>
                            {/* Inside Sidebar Close Button */}
                            <button onClick={() => setSidebarOpen(false)} className="text-gray-500 hover:text-white transition-colors w-8 h-8 flex items-center justify-center rounded hover:bg-white/10">
                                <i className="fa-solid fa-xmark"></i>
                            </button>
                        </div>
                        
                        <div className="flex-1 py-4 overflow-y-auto custom-scrollbar flex flex-col gap-1 px-3">
                            <div className="text-[10px] font-mono text-gray-500 mb-2 px-3 uppercase tracking-widest">External Features</div>
                            {navItems.map((item, idx) => {
                                if (item.isDivider) return <div key={idx} className="h-px bg-white/5 my-4 mx-2"></div>;
                                return (
                                    <button 
                                        key={item.id}
                                        onClick={() => { setCurrentView(item.id); setSidebarOpen(false); }}
                                        className={`w-full flex items-center gap-3 px-3 py-3 rounded transition-all font-mono text-xs tracking-wide ${
                                            currentView === item.id 
                                                ? 'bg-quantum/20 text-white border-l-2 border-quantum shadow-inner' 
                                                : 'text-gray-400 hover:bg-white/5 hover:text-gray-200 border-l-2 border-transparent'
                                        }`}
                                    >
                                        <i className={`fa-solid ${item.icon} w-5 text-center ${currentView === item.id ? 'text-quantum' : 'opacity-70'}`}></i>
                                        <span>{item.label}</span>
                                    </button>
                                );
                            })}
                        </div>
                    </div>

                    {/* Overlay for sidebar on mobile */}
                    {sidebarOpen && (
                        <div className="fixed inset-0 bg-black/50 backdrop-blur-sm z-30 transition-opacity" onClick={() => setSidebarOpen(false)}></div>
                    )}

                    {/* Main Content View */}
                    <div className="flex-1 flex flex-col h-screen relative overflow-hidden bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-dark via-darker to-[#000]">
                        
                        {/* Header */}
                        <header className="h-16 border-b border-white/5 flex items-center px-4 md:px-6 justify-between z-10 bg-black/30 backdrop-blur-md shrink-0">
                            <div className="flex items-center gap-4">
                                {/* Dedicated Aero Command Button replacing standard hamburger */}
                                <button 
                                    onClick={() => setSidebarOpen(true)} 
                                    className="flex items-center gap-2 bg-quantum/10 hover:bg-quantum/20 text-quantum border border-quantum/30 px-3 md:px-4 py-2 rounded text-[10px] md:text-xs font-mono font-bold tracking-widest uppercase transition-all shadow-[0_0_10px_rgba(6,182,212,0.1)] hover:shadow-[0_0_15px_rgba(6,182,212,0.3)]"
                                >
                                    <i className="fa-solid fa-layer-group"></i>
                                    <span className="hidden sm:inline">Aero Command</span>
                                    <span className="sm:hidden">Menu</span>
                                </button>
                                
                                <div className="font-mono text-xs text-gray-500 hidden md:flex items-center gap-2">
                                    <i className="fa-solid fa-angle-right text-[10px]"></i> 
                                    <span className="text-gray-300">{navItems.find(i => i.id === currentView)?.label || 'System'}</span>
                                </div>
                            </div>
                            
                            <div className="flex items-center gap-4">
                                <div className="flex items-center gap-3 mr-4">
                                    <div className="text-right hidden sm:block">
                                        <div className="text-[10px] font-bold text-white font-mono uppercase">{userData?.name || 'Loading...'}</div>
                                        <div className="text-[9px] text-quantum font-mono">{userData?.clearanceLevel || 'Pending'}</div>
                                    </div>
                                    <div className="w-8 h-8 rounded border border-quantum bg-black flex items-center justify-center font-bold text-sm text-quantum">
                                        {userData?.name ? userData.name.charAt(0).toUpperCase() : 'O'}
                                    </div>
                                </div>
                                <button onClick={() => window.location.reload()} className="text-[10px] font-mono text-gray-500 hover:text-alert transition-colors flex flex-col items-center gap-1 group" title="Logout">
                                    <i className="fa-solid fa-power-off group-hover:drop-shadow-[0_0_5px_#ef4444]"></i>
                                </button>
                            </div>
                        </header>

                        {/* Content Area - Designed to fill remaining space perfectly */}
                        <main className="flex-1 overflow-hidden relative z-0 p-4 md:p-6 flex flex-col">
                            <div className="w-full max-w-7xl mx-auto h-full relative">
                                {currentView === 'dashboard' && <AeroDashboard location={location} userData={userData} />}
                                {currentView === 'ai' && <AdvancedAIAgent userData={userData} location={location} user={user} />}
                                {currentView === 'security' && <SecurityCenter />}
                                {['home', 'about', 'faq', 'privacy', 'terms'].includes(currentView) && <InfoPages page={currentView} />}
                            </div>
                        </main>
                    </div>
                </div>
            );
        };

        const App = () => {
            const [user, setUser] = useState(null);
            const [loading, setLoading] = useState(true);

            useEffect(() => {
                const checkFirebase = setInterval(() => {
                    if (window.firebaseAuth) {
                        clearInterval(checkFirebase);
                        window.firebaseAuth.onAuthStateChanged((currUser) => {
                            if (currUser) setUser(currUser);
                            setLoading(false);
                        });
                    }
                }, 100);
                return () => clearInterval(checkFirebase);
            }, []);

            if (loading) {
                return (
                    <div className="h-screen w-screen flex flex-col items-center justify-center bg-darker">
                        <div className="relative w-20 h-20 mb-8">
                            <div className="absolute inset-0 border-t-2 border-quantum rounded-full animate-spin"></div>
                            <div className="absolute inset-2 border-r-2 border-secondary rounded-full animate-spin-slow"></div>
                            <i className="fa-brands fa-space-awesome text-2xl text-quantum absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2"></i>
                        </div>
                        <h2 className="text-xs font-mono tracking-[0.4em] text-quantum animate-pulse">DECRYPTING KARMANYA CORE</h2>
                    </div>
                );
            }

            return user ? <MainApp user={user} /> : <AuthScreen onLogin={setUser} />;
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
